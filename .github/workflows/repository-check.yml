name: Repository checks and Pages deployment
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-check:
    name: repository-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/validate-repository.mjs
      - run: node scripts/check-assets.mjs
      - run: node --test scripts/*.test.mjs
      - name: Documentation impact check
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-docs-impact.mjs
      - name: Documentation impact check (warning only on push)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-docs-impact.mjs
  application-check:
    name: application-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_FORM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Find the successful PR run for this merge
        id: find-pr-run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });
            const pullRequest = associated.data.find((item) =>
              item.merged_at &&
              item.merge_commit_sha === context.sha &&
              item.base.ref === "main"
            );

            if (!pullRequest) {
              core.info("No merged PR is associated with this push; a full main build will run.");
              return;
            }

            const workflows = await github.rest.actions.listRepoWorkflows({
              owner,
              repo,
              per_page: 100,
            });
            const workflow = workflows.data.workflows.find((item) =>
              item.path === ".github/workflows/repository-check.yml" && item.state === "active"
            );
            if (!workflow) {
              core.warning("The release workflow could not be identified; a full main build will run.");
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: "pull_request",
              head_sha: pullRequest.head.sha,
              per_page: 100,
            });
            const successfulRun = data.workflow_runs
              .filter((run) =>
                run.workflow_id === workflow.id &&
                run.status === "completed" &&
                run.conclusion === "success" &&
                run.head_sha === pullRequest.head.sha
              )
              .sort((left, right) => Date.parse(right.updated_at) - Date.parse(left.updated_at))[0];

            if (!successfulRun) {
              core.info("No successful PR workflow run matches the merged head; a full main build will run.");
              return;
            }

            core.setOutput("run_id", String(successfulRun.id));
            core.setOutput("pull_request_number", String(pullRequest.number));
            core.info(`Found successful PR #${pullRequest.number} workflow run ${successfulRun.id}.`);

      - name: Download the tested PR site
        id: download-pr-site
        if: steps.find-pr-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pages-site
          path: release-candidate/site
          repository: ${{ github.repository }}
          run-id: ${{ steps.find-pr-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download tested PR metadata
        id: download-pr-metadata
        if: steps.find-pr-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pages-site-metadata
          path: release-candidate/metadata
          repository: ${{ github.repository }}
          run-id: ${{ steps.find-pr-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the PR artifact matches this main tree
        id: reuse-pr-artifact
        if: steps.find-pr-run.outputs.run_id != ''
        uses: actions/github-script@v9
        env:
          EXPECTED_RUN_ID: ${{ steps.find-pr-run.outputs.run_id }}
          EXPECTED_PR_NUMBER: ${{ steps.find-pr-run.outputs.pull_request_number }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { execFileSync } = require("node:child_process");
            const metadataPath = path.join("release-candidate", "metadata", "pages-build-metadata.json");
            const requiredSiteFiles = [
              "index.html",
              "avatar/index.html",
              "dragon-cave/cave-day.webp",
              "dragon-cave/cave-night.webp",
            ];
            const currentTree = execFileSync("git", ["rev-parse", "HEAD^{tree}"], {
              encoding: "utf8",
            }).trim();
            let metadata;
            try {
              metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
            } catch {
              core.warning("The PR metadata artifact is missing or invalid; a full main build will run.");
              core.setOutput("reusable", "false");
              return;
            }

            const completeSite = requiredSiteFiles.every((file) =>
              fs.existsSync(path.join("release-candidate", "site", file))
            );
            const matches =
              completeSite &&
              metadata.eventName === "pull_request" &&
              metadata.workflowRunId === Number(process.env.EXPECTED_RUN_ID) &&
              metadata.pullRequestNumber === Number(process.env.EXPECTED_PR_NUMBER) &&
              metadata.sourceTree === currentTree;

            core.setOutput("reusable", String(matches));
            if (matches) {
              core.info(`PR #${metadata.pullRequestNumber} artifact matches main tree ${currentTree}.`);
            } else {
              core.warning("The PR artifact does not match this complete main tree; a full main build will run.");
            }

      - name: Promote the tested PR site
        if: steps.reuse-pr-artifact.outputs.reusable == 'true'
        run: |
          mkdir -p out
          cp -a release-candidate/site/. out/

      - uses: actions/setup-node@v7
        if: steps.reuse-pr-artifact.outputs.reusable != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies for the full validation path
        if: steps.reuse-pr-artifact.outputs.reusable != 'true'
        run: npm ci
      - name: Build for the full validation path
        if: steps.reuse-pr-artifact.outputs.reusable != 'true'
        run: npm run build
      - name: Install Chromium for the full validation path
        if: steps.reuse-pr-artifact.outputs.reusable != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run browser tests for the full validation path
        if: steps.reuse-pr-artifact.outputs.reusable != 'true'
        run: npm run test:e2e
      - name: Record tested source tree
        if: success() && steps.reuse-pr-artifact.outputs.reusable != 'true'
        run: node scripts/write-pages-build-metadata.mjs
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: pages-site
          path: out/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: success() && steps.reuse-pr-artifact.outputs.reusable != 'true'
        with:
          name: pages-site-metadata
          path: pages-build-metadata.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  quality-check:
    name: quality-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  deploy:
    name: deploy
    needs: [repository-check, application-check, quality-check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pages-site
          path: out
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
